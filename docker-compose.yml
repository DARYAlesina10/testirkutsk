services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chestnaya_skidka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
  redis:
    image: redis:7
    ports: ['6379:6379']
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chestnaya_skidka
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    ports: ['3001:3001']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports: ['3000:3000']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 15s
      timeout: 5s
      retries: 6
  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    depends_on: [api, redis]
